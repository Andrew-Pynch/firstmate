# Firstmate worker posture for omp (Oh My Pi), passed as `--config` on every
# Firstmate-launched omp session (crewmate, scout, and secondmate alike) by
# bin/fm-spawn.sh, whose header owns why the launch carries it. It is the omp
# analogue of the Pi adapter's `--tui-mode regular` pin: a per-launch overlay,
# never a write to the captain's own ~/.omp/agent/config.yml, which stays
# exactly as the captain set it (model roles, theme, providers, compaction).
# Each key below pins one setting whose captain-facing value would park an
# unattended worker on an interactive prompt, change its pinned model under it,
# make its composer unreadable to bin/fm-composer-lib.sh, or spend premium
# quota on a model the worker never asked for. Verified against omp 18.2.6's
# own settings schema and model-role resolver (`omp config list`).
modelRoles:
  # The advisor is a second model that reviews every turn of every worker
  # session, so what the `advisor` role resolves to is spent per session, on
  # every host, for as long as the worker runs. OMP resolves an unset advisor
  # role through the `slow` priority chain
  # (src/config/model-resolver.ts, `ROLE_PRIORITY_ALIAS`), which is a premium
  # reasoning model on the farm's hosts, so a host profile that names an
  # expensive advisor or names none at all silently bills reviews to premium
  # quota. Pinning the role here makes every worker session's advisor
  # identical whatever the host's own config says. 2026-09-26 (Andrew): the
  # DeepSeek platform quota is exhausted, so the advisor is Grok 4.7 through
  # the xai OAuth account, the same advisor Main uses (~/.omp/agent/config.yml).
  advisor: xai-oauth/grok-4.7
advisor:
  # 2026-10-04 (Andrew): xai Grok credits are empty until about 2026-10-09, and
  # when Grok fails omp fell back to openai-codex/gpt-6-astra, adding a large
  # Codex burn (swarm-efficiency report: Astra worker advisors about $4,016
  # API-equal; all advisors plus subagents were 23.9% of total fleet spend
  # across every provider). Workers run with no advisor
  # until Grok resets; then set this back to true.
  enabled: false
composer:
  # Renders a bare `❯` (U+276F) row, a glyph the shared composer classifier
  # already reads; the shipped default `band` and six other shapes are not in
  # its catalogue, and the shape is otherwise a captain-level setting.
  shape: borderless
plan:
  # `plan.defaultOnStartup: true` opens every session read-only; a worker that
  # cannot edit files sits on its brief forever.
  defaultOnStartup: false
prewalk:
  # Prewalk swaps the active model for the `smol` role after the first edit, so
  # a worker pinned with --model would silently change model mid-task.
  enabled: false
retry:
  # `confirm` pops a dialog when a usage window runs low; `auto` lets omp fall
  # through the captain's own fallback chain without a keystroke.
  usageReservePolicy: auto
