# Read-only posture for the Sol diff review that the ship brief's definition of
# done (bin/fm-dod-lib.sh, fm_sol_review_step) runs headless before the PR. It
# is passed as a second `--config` after .omp/fm-worker-overlay.yml, for that
# one review run only, never for the worker session itself and never written
# to the host's own ~/.omp/agent/config.yml.
# The review must not be able to change anything, whatever the host configures.
# Without this layer the host can hand the review a mutating tool two ways: any
# MCP server, custom tool, hook, or extension it discovers, and a WATCHDOG.yml
# advisor `tools` list together with a `tools.approval: allow` for that tool.
# Verified against omp 18.6.1's own
# source: a `--config` layer replaces arrays and merges `tools.approval` per
# key, so the values below win over the host's.
disabledProviders:
  # Every discovery provider except the two that only load AGENTS.md and
  # CLAUDE.md context files, so the review session discovers no MCP server,
  # custom tool, hook, extension, or project settings layer, and Sol still
  # reads the project's own rules. A provider a later omp adds is not listed
  # here; the review step's tool check refuses to run when one gives the
  # primary a tool, but it cannot see one that only runs code.
  - native
  - builtin-defaults
  - omp-managed
  - omp-plugins
  - agent-plugins
  - agents
  - claude
  - claude-plugins
  - cline
  - codex
  - cursor
  - gemini
  - github
  - mcp-json
  - opencode
  - skillshare
  - ssh-json
  - vscode
  - windsurf
tools:
  # Without this, an explicit tool list that omits `write` still gets a
  # device-only `write` that dispatches mounted xd:// devices, MCP tools included.
  xdev: false
  approval:
    # An advisor's tools come from omp's built-in set, filtered by the host's
    # WATCHDOG.yml roster, which can grant any of them. A `deny` is checked
    # before the host's own allow policy and the tool's own policy, in every
    # approval mode, so only read, grep, and glob can run in this review. The
    # list is every other built-in in omp 18.6.1; the live overlay guard fails
    # when an installed omp has a built-in this list does not deny.
    ask: deny
    ast_edit: deny
    ast_grep: deny
    bash: deny
    checkpoint: deny
    context_notes: deny
    debug: deny
    edit: deny
    eval: deny
    find: deny
    github: deny
    ida: deny
    learn: deny
    lsp: deny
    manage_skill: deny
    memory_edit: deny
    new_context: deny
    recall: deny
    reflect: deny
    retain: deny
    rewind: deny
    security_scan: deny
    task: deny
    todo: deny
    wait: deny
    web_search: deny
    write: deny
